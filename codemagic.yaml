workflows:
  build-android:
    name: Build Android APK
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Dependencies
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Setup Android Platform & Set Icon
        script: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          
          # نسخ صورة icon-512.png لتصبح أيقونة التطبيق الرسمية
          if [ -f icon-512.png ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp icon-512.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp icon-512.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp icon-512.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            done
          fi

          npx cap copy android
          npx cap sync android
      - name: Build APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
