workflows:
  build-android:
    name: Build Android APK
    instance_type: mac_mini_m1
    environment:
      node: 18
    scripts:
      - name: Install Dependencies
        script: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
      - name: Prepare Web Assets & Set Icon
        script: |
          # 1. إنشاء مجلد www ونسخ ملفات الويب بداخله
          mkdir -p www
          cp -r index.html manifest.json sw.js icon-*.png favicon-32.png www/ 2>/dev/null || true

          # 2. إضافة منصة Android إذا لم تكن موجودة
          if [ ! -d android ]; then
            npx cap add android
          fi

          # 3. نسخ صورة icon-512.png إلى مجلدات الأيقونات الرسمية للأندرويد
          if [ -f icon-512.png ]; then
            for dir in android/app/src/main/res/mipmap-*; do
              cp icon-512.png "$dir/ic_launcher.png" 2>/dev/null || true
              cp icon-512.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              cp icon-512.png "$dir/ic_launcher_foreground.png" 2>/dev/null || true
            done
          fi

          # 4. مزامنة الملفات مع مجلد أندرويد
          npx cap copy android
          npx cap sync android
      - name: Build APK
        script: |
          cd android && ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/*.apk
